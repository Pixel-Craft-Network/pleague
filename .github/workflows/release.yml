name: Package release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach web release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build a root-relative standalone web package
        run: BASE_PATH=/ npm run build
      - name: Zip the playable site
        run: cd dist && zip -qr "../pixel-league-${GITHUB_REF_NAME}.zip" .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "pixel-league-${GITHUB_REF_NAME}.zip" --title "Pixel League $GITHUB_REF_NAME" --generate-notes
